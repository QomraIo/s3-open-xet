[package]
name = "openxet-storage"
version = "0.0.0"
description = "openxet's bucket: durable, content-addressed object storage"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
futures-core = "0.3.34"
futures-util = "0.3.34"
# The bucket's own SigV4 requests, built as object_store's `HttpRequest`.
http = "1.5.0"
# M3 object-store buckets (ADR 0015 item 5). S3 and S3-compatible stores only
# for now; GCS and Azure follow behind their own features.
object_store = { version = "0.12", default-features = false, features = ["aws"] }
openxet-protocol = { path = "../protocol", version = "0.0.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
